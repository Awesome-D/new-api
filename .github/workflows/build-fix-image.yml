name: Build SolFix image

on:
  push:
    branches:
      - fix/responses-stream-billing-hardening
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/awesome-d/new-api

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SolFix version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .solfix-version)"
          if [ -z "$VERSION" ]; then
            echo "::error::.solfix-version is empty"
            exit 1
          fi
          APP_VERSION="v${VERSION}-solfix"
          printf '%s\n' "$APP_VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building SolFix $VERSION as $APP_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:solfix-${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:solfix
          cache-from: type=gha
          cache-to: type=gha,mode=max
