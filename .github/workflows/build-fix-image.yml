name: Build responses fix image

on:
  push:
    branches:
      - fix/responses-stream-billing-hardening
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/awesome-d/new-api:responses-stream-billing-hardening
            ghcr.io/awesome-d/new-api:responses-stream-billing-hardening-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
